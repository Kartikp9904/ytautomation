services:
  postgres:
    image: postgres:16-alpine
    container_name: yt_automation_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yt_automation}
      POSTGRES_USER: ${POSTGRES_USER:-yt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yt_secure_password_change_me}
    volumes:
      - yt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yt_user} -d ${POSTGRES_DB:-yt_automation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yt_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yt_automation_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-yt_user}:${POSTGRES_PASSWORD:-yt_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-yt_automation}
    volumes:
      - yt_data:/app/data
      - yt_storage:/app/storage
      - yt_temp:/app/temp
      - yt_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - yt_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yt_automation_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - yt_network

volumes:
  yt_postgres_data:
    name: yt_automation_postgres_data
  yt_data:
    name: yt_automation_data
  yt_storage:
    name: yt_automation_storage
  yt_temp:
    name: yt_automation_temp
  yt_logs:
    name: yt_automation_logs

networks:
  yt_network:
    name: yt_automation_network
    driver: bridge
